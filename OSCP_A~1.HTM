#tabs{background:#161b22;border-bottom:1px solid #30363d;padding:6px 16px;display:flex;gap:4px;flex-wrap:wrap;z-index:10;position:relative}
.tab{padding:5px 12px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;font-family:inherit;font-size:12px}
.tab:hover,.tab.on{color:#0d1117;border-color:#58a6ff;background:#58a6ff}
#canvas{width:100%;height:calc(100vh - 90px);overflow:hidden;cursor:grab;position:relative}
#canvas:active{cursor:grabbing}
#canvas svg{position:absolute;top:0;left:0}
.edge{fill:none;stroke-width:1}
#toast{position:fixed;bottom:20px;right:20px;background:#3fb950;color:#0d1117;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;font-family:monospace}
#toast.show{opacity:1}
#tip{position:fixed;bottom:16px;left:16px;color:#8b949e;font-size:11px;z-index:10}
</style>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById("treedata").textContent);
  var svg = document.getElementById("svg");
  var canvas = document.getElementById("canvas");
  var vx = 0, vy = 0, vz = 1;
  var dragging = false, dragX, dragY;

  function buildTabs(){
    var tabs = document.getElementById("tabs");
    DATA.forEach(function(sec, i){
      var b = document.createElement("button");
      b.className = "tab" + (i === 0 ? " on" : "");
      b.textContent = sec.label.replace(/\n/g, " ");
      b.style.borderColor = sec.color;
      b.onclick = function(){
        document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("on"); });
        b.classList.add("on");
        drawTree(sec);
      };
      tabs.appendChild(b);
    });
  }

  function ns(tag){
    return document.createElementNS("http://www.w3.org/2000/svg", tag);
  }

  function drawTree(sec){
    svg.innerHTML = "";
    var W = canvas.clientWidth;
    var H = canvas.clientHeight;
    svg.setAttribute("width", W * 3);
    svg.setAttribute("height", H * 3);

    var rootX = 160;
    var rootY = H * 1.5;
    var techCount = sec.children.length;
    var techSpacing = Math.min(140, (H * 2.6) / (techCount + 1));
    var techStartY = rootY - ((techCount - 1) * techSpacing) / 2;

    drawNode(rootX, rootY, sec.label, sec.color, sec.color, "#0d1117", 140, 52, 15, true);

    sec.children.forEach(function(tech, ti){
      var techX = rootX + 280;
      var techY = techStartY + ti * techSpacing;

      drawCurve(rootX + 70, rootY, techX - 65, techY, sec.color);
      drawNode(techX, techY, tech.label, "#161b22", sec.color, sec.color, 130, 46, 12, true);

      var cmdCount = tech.cmds.length;
      var cs = Math.min(38, (techSpacing * 0.85) / Math.max(cmdCount, 1));
      var cmdStartY = techY - ((cmdCount - 1) * cs) / 2;

      tech.cmds.forEach(function(cmd, ci){
        var cmdX = techX + 320;
        var cmdY = cmdStartY + ci * cs;
        var display = cmd.length > 52 ? cmd.substring(0, 49) + "..." : cmd;

        var tw = Math.max(display.length * 6.8 + 24, 100);
        drawCurve(techX + 65, techY, cmdX - tw/2, cmdY, "#30363d");
        drawCmdNode(cmdX, cmdY, display, cmd, tw);
      });
    });

    vx = -80; vy = 0; vz = 0.6;
    applyTransform();
  }

  function drawNode(cx, cy, text, fill, stroke, textFill, w, h, fontSize, isBold){
    var g = ns("g");
    var r = ns("rect");
    r.setAttribute("x", cx - w/2);
    r.setAttribute("y", cy - h/2);
    r.setAttribute("width", w);
    r.setAttribute("height", h);
    r.setAttribute("rx", 10);
    r.setAttribute("ry", 10);
    r.setAttribute("fill", fill);
    r.setAttribute("stroke", stroke);
    r.setAttribute("stroke-width", 2);
    g.appendChild(r);

    var lines = text.split("\n");
    lines.forEach(function(line, i){
      var t = ns("text");
      t.setAttribute("x", cx);
      t.setAttribute("y", cy + (i - (lines.length - 1) / 2) * 16);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("fill", textFill);
      t.setAttribute("font-size", fontSize);
      if(isBold) t.setAttribute("font-weight", "700");
      t.textContent = line;
      g.appendChild(t);
    });
    svg.appendChild(g);
  }

  function drawCmdNode(cx, cy, display, full, tw){
    var g = ns("g");
    g.style.cursor = "pointer";

    var r = ns("rect");
    r.setAttribute("x", cx - tw/2);
    r.setAttribute("y", cy - 15);
    r.setAttribute("width", tw);
    r.setAttribute("height", 30);
    r.setAttribute("rx", 6);
    r.setAttribute("ry", 6);
    r.setAttribute("fill", "#0d1117");
    r.setAttribute("stroke", "#21262d");
    r.setAttribute("stroke-width", 1);

    var t = ns("text");
    t.setAttribute("x", cx);
    t.setAttribute("y", cy);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("fill", "#3fb950");
    t.setAttribute("font-size", "11");
    t.setAttribute("font-family", "'Cascadia Code','Fira Code',monospace");
    t.textContent = display;

    g.appendChild(r);
    g.appendChild(t);

    g.onmouseenter = function(){ r.setAttribute("stroke", "#3fb950"); };
    g.onmouseleave = function(){ r.setAttribute("stroke", "#21262d"); };

    g.onclick = function(e){
      e.stopPropagation();
      navigator.clipboard.writeText(full).then(function(){
        var toast = document.getElementById("toast");
        toast.textContent = "Copied: " + full.substring(0, 50) + (full.length > 50 ? "..." : "");
        toast.classList.add("show");
        setTimeout(function(){ toast.classList.remove("show"); }, 1500);
      });
    };

    svg.appendChild(g);
  }

  function drawCurve(x1, y1, x2, y2, color){
    var p = ns("path");
    var mx = (x1 + x2) / 2;
    p.setAttribute("d", "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2);
    p.setAttribute("class", "edge");
    p.setAttribute("stroke", color);
    svg.appendChild(p);
  }

  function applyTransform(){
    svg.style.transform = "translate(" + vx + "px," + vy + "px) scale(" + vz + ")";
    svg.style.transformOrigin = "0 0";
  }

  canvas.addEventListener("mousedown", function(e){
    dragging = true; dragX = e.clientX - vx; dragY = e.clientY - vy;
  });
  canvas.addEventListener("mousemove", function(e){
    if(!dragging) return;
    vx = e.clientX - dragX;
    vy = e.clientY - dragY;
    applyTransform();
  });
  canvas.addEventListener("mouseup", function(){ dragging = false; });
  canvas.addEventListener("mouseleave", function(){ dragging = false; });

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    var dz = e.deltaY > 0 ? 0.9 : 1.1;
    var nz = Math.max(0.15, Math.min(3, vz * dz));
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    vx = mx - (mx - vx) * (nz / vz);
    vy = my - (my - vy) * (nz / vz);
    vz = nz;
    applyTransform();
  }, {passive: false});

  buildTabs();
  drawTree(DATA[0]);
})();
</script>
</body>
</html>
